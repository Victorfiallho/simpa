# Integração contínua: roda em todo push e pull request (RNF02, RNF07).
name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend (lint e testes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            services/*/requirements.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - name: Testes de cada serviço
        run: |
          for servico in auth academico analitico; do
            echo "::group::$servico"
            (cd "services/$servico" && pytest -q) || exit 1
            echo "::endgroup::"
          done

  frontend:
    name: Frontend (TypeScript e build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  docker:
    name: Imagens Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose -f docker-compose.yml build
