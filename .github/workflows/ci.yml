# Integração contínua: roda em todo push e pull request (RNF02, RNF07).
name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend (lint e testes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            services/*/requirements.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - name: Testes de cada serviço
        run: |
          for servico in auth academico analitico; do
            echo "::group::$servico"
            (cd "services/$servico" && pytest -q --cov=app --cov-report=term-missing:skip-covered --cov-fail-under=80) || exit 1
            echo "::endgroup::"
          done
      - name: Contrato entre o front e o backend (valores enumerados)
        run: pytest -q tests/contrato
      - name: Criptografia e recusas do backup (sem Docker)
        run: pytest -q tests/backup

  monitoramento:
    name: Monitoramento (regras de alerta e configuração)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configuração e testes das regras do Prometheus (promtool)
        run: |
          docker run --rm -v "$PWD/infra/monitoramento/prometheus:/etc/prometheus:ro" --entrypoint promtool prom/prometheus:v2.55.1 check config /etc/prometheus/prometheus.yml
          docker run --rm -v "$PWD/infra/monitoramento/prometheus:/etc/prometheus:ro" --entrypoint promtool prom/prometheus:v2.55.1 test rules /etc/prometheus/regras.test.yml
      - name: Configuração do Alertmanager (amtool)
        run: docker run --rm -v "$PWD/infra/monitoramento/alertmanager:/etc/alertmanager:ro" --entrypoint amtool prom/alertmanager:v0.27.0 check-config /etc/alertmanager/alertmanager.yml
      - name: Dashboard do Grafana é um JSON válido
        run: python3 -m json.tool infra/monitoramento/grafana/dashboards/simpa-filas.json > /dev/null
      - name: Compose do monitoramento é válido
        run: |
          cp .env.example .env
          docker compose -f docker-compose.yml -f compose.monitoramento.yml config --quiet

  frontend:
    name: Frontend (TypeScript e build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  docker:
    name: Imagens Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose -f docker-compose.yml build
