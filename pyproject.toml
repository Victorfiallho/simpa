[project]
name = "simpa"
version = "0.1.0"
description = "Sistema Inteligente de Monitoramento e Predição Acadêmica"
requires-python = ">=3.11"

# ---------- Linter e formatador (RNF02) ----------
[tool.ruff]
line-length = 100
target-version = "py311"
# Cada serviço tem o próprio pacote `app`; isto faz o ruff tratá-lo como código do projeto.
src = ["services/auth", "services/academico", "services/analitico"]
# Migrações são geradas pelo Alembic; revisadas à mão, mas fora do padrão de estilo.
extend-exclude = ["services/*/migrations/versions"]

[tool.ruff.lint]
# E/W = estilo PEP8 | F = erros (variável não usada etc.) | I = ordem dos imports
# N = nomenclatura | B = bugs comuns | S = segurança (bandit) | UP = sintaxe moderna
select = ["E", "W", "F", "I", "N", "B", "S", "UP"]

[tool.ruff.lint.per-file-ignores]
# Nos testes, assert e senhas falsas fixas são esperados; `Decimal as D` deixa as contas legíveis
"**/tests/**" = ["S101", "S105", "S106", "N817"]

# ---------- Testes (RNF07) ----------
# Cada serviço tem o próprio pytest.ini; rode `pytest` dentro de services/<servico>.
