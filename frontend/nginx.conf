# Servidor do frontend (atrás do gateway). As rotas são do React Router, então qualquer
# caminho que não seja um arquivo devolve o index.html.
server {
    listen 80;
    root /usr/share/nginx/html;

    # Content-Security-Policy da aplicação (defesa em profundidade contra XSS, já que o token da
    # sessão fica no sessionStorage). Tudo é servido pela própria origem:
    # - script-src 'self': o build do Vite não tem script inline; scripts injetados não executam;
    # - style-src com 'unsafe-inline': o React e o Recharts usam o atributo style;
    # - connect-src 'self': a página só fala com a API do gateway;
    # - frame-ancestors 'none': ninguém embute o SIMPA em outra página.
    # (add_header em um location anula os do server, então ele é repetido nos dois.)
    location / {
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }

    # Arquivos gerados pelo Vite têm hash no nome: podem ficar em cache por muito tempo.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
