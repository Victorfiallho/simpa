# Gateway do SIMPA: única porta de entrada do sistema (D13).
# Repassa cada prefixo de URL para o serviço certo e gera o X-Request-ID (RF12).

log_format simpa '$remote_addr [$time_local] "$request" $status $body_bytes_sent '
                 '$request_time request_id=$request_id';

# Resolve os nomes dos containers no DNS interno do Docker a cada 10 s. Assim o gateway
# continua funcionando quando um serviço é recriado e muda de IP.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;
    access_log /var/log/nginx/access.log simpa;
    client_max_body_size 10m;

    # Cabeçalhos de segurança em TODAS as respostas (API e front). Nenhum location abaixo usa
    # add_header, então estes valem para todos (add_header em location anularia os do server).
    # A Content-Security-Policy fica no nginx do frontend (frontend/nginx.conf): ela só faz
    # sentido para a página, e o Swagger (/api/*/docs) carrega scripts de CDN que ela bloquearia.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    # HSTS só vale em HTTPS: ative no proxy TLS que ficar na frente do gateway em produção.

    # Cabeçalhos repassados a todos os serviços. O X-Request-ID é sempre gerado aqui,
    # nunca aceito do cliente, para ninguém forjar o identificador nos logs.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;

    # Rotas /internal são só para conversa entre serviços (ex.: analítico → acadêmico).
    location ~ ^/api/[^/]+/internal(/|$) {
        return 404;
    }

    location /api/auth/ {
        set $servico http://auth:8000;
        rewrite ^/api/auth/(.*)$ /$1 break;
        proxy_pass $servico;
    }

    location /api/academico/ {
        set $servico http://academico:8000;
        rewrite ^/api/academico/(.*)$ /$1 break;
        proxy_pass $servico;
    }

    location /api/analitico/ {
        set $servico http://analitico:8000;
        rewrite ^/api/analitico/(.*)$ /$1 break;
        proxy_pass $servico;
    }

    location / {
        set $servico http://frontend:80;
        proxy_pass $servico;
    }
}
